{% extends 'base.html' %}

{% block title %}Create Account - StudyFlow{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
  <div class="card" style="width: 100%; max-width: 480px; padding: 2.25rem 2rem; box-shadow: var(--shadow-lg);">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-logo" style="margin: 0 auto 1rem auto; width: 52px; height: 52px; font-size: 1.5rem;">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h2 style="font-size: 1.45rem; font-weight: 700; margin-bottom: 0.35rem;">Start Your Study Journey</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">Organize timetable, track deadlines, and reach your goals</p>
    </div>

    <!-- Registration Form -->
    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. sarah_99" required autofocus>
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="sarah@university.edu" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Sarah Connor">
        </div>
        <div class="form-group">
          <label for="major">Major / Field of Study</label>
          <input type="text" id="major" name="major" class="form-control" placeholder="e.g. Computer Science">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 chars" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600; margin-top: 0.75rem;">
        <i class="fas fa-user-plus"></i> Create My Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
